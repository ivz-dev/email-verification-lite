# nginx site config for api.emailabs.io
#
# Topology:  client → Cloudflare (TLS + WAF) → this nginx (origin TLS) → Node app
#
# Place at /etc/nginx/sites-available/api.emailabs.io and symlink into
# sites-enabled, or drop into /etc/nginx/conf.d/. Reload with `nginx -t && nginx -s reload`.

# The Node app (PM2 cluster) listening on loopback.
upstream email_verification_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP :80 -------------------------------------------------------------
# With Cloudflare SSL set to "Full (strict)", the edge talks to the origin over
# HTTPS, so :80 only needs to bounce stray plaintext requests up to :443.
server {
    listen 80;
    listen [::]:80;
    server_name api.emailabs.io;
    # 308 (not 301) preserves the method and body, so a POST that arrives over
    # plain HTTP is re-issued as a POST to HTTPS instead of being downgraded to
    # a bodyless GET.
    return 308 https://$host$request_uri;
}

# --- HTTPS :443 -----------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.emailabs.io;

    # Cloudflare Origin Certificate (generate in CF dashboard:
    # SSL/TLS → Origin Server → Create Certificate). Long-lived, trusted only
    # by Cloudflare — which is exactly what "Full (strict)" needs.
    ssl_certificate     /etc/nginx/ssl/emailabs.io/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/emailabs.io/origin.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Recover the real client IP from Cloudflare.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Refuse anything that did not come through Cloudflare. Comment out if you
    # need to reach the origin directly (e.g. local debugging).
    include /etc/nginx/snippets/cloudflare-allowlist.conf;

    # Request body cap. App accepts JSON up to 256kb; leave headroom.
    client_max_body_size 512k;

    # Security headers (Cloudflare can add these too; harmless to set at origin).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    access_log /var/log/nginx/api.emailabs.io.access.log;
    error_log  /var/log/nginx/api.emailabs.io.error.log;

    location / {
        proxy_pass http://email_verification_backend;
        proxy_http_version 1.1;

        # Forwarding headers.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        # Pass Cloudflare's client IP through to the app as well.
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        # Keep upstream connections alive.
        proxy_set_header Connection "";

        # Timeouts (DNS lookups in the app can take a few seconds).
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Lightweight liveness check; skip access logging noise.
    location = /health {
        access_log off;
        proxy_pass http://email_verification_backend;
        proxy_set_header Host $host;
    }
}
